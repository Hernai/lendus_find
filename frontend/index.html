<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1E40AF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LendusFind">
    <!-- Manifest PWA dinámico por tenant. Vive en el backend (apifind.lendus.app)
         porque el subdominio del frontend solo sirve estáticos. Usamos
         %VITE_API_URL% para que se inyecte en build time desde .env*.
         Sin `crossorigin` porque el manifest es público (no necesita Bearer
         token ni cookies). Con `use-credentials` el browser exige
         Access-Control-Allow-Credentials:true y el backend tiene
         supports_credentials=false por diseño (auth Bearer, no cookies). -->
    <link rel="manifest" href="%VITE_API_URL%/v2/public/manifest">
    <title>LendusFind</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
